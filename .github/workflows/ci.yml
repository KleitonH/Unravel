name: CI

on:
  push:
    branches: [development, main]
  pull_request:
    branches: [development, main]

# Cancela runs anteriores no mesmo PR/branch — economiza minutos.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ── Backend ──────────────────────────────────────────────────────
  backend-test:
    name: Backend · build + tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Restore
        run: dotnet restore

      - name: Build (no restore)
        run: dotnet build --no-restore --configuration Release --nologo

      - name: Run tests
        # Suite atual: 125 testes (Forge/Journey/Knowledge/Mastery/
        # Onboarding/Gamification). Sem cobertura de integração com DB
        # ainda — quando tiver, considerar spin de container postgres
        # via services.
        run: |
          dotnet test tests/Unravel.Tests/Unravel.Tests.csproj \
            --no-build --configuration Release --nologo \
            --logger "console;verbosity=minimal"

  # ── Frontend ─────────────────────────────────────────────────────
  # Stack atual (PR 21+): Vite 5 + React 18 + TypeScript + Tailwind +
  # shadcn-style. Antes era Angular; o build script é `vite build`
  # (NÃO `ng build --configuration ...`).
  frontend-check:
    name: Frontend · lint + typecheck + build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install
        run: npm ci

      - name: Lint
        # Vite gera eslint.config.js — pega problemas de hooks e tipos
        # antes do typecheck. Continue-on-error pra não bloquear merge em
        # warnings menores enquanto o codebase estabiliza.
        run: npx eslint .
        continue-on-error: true

      - name: Typecheck (strict, sem emit)
        # tsc -b roda em modo build (compose projects) usando tsconfig.json
        # + tsconfig.app.json + tsconfig.node.json. Detecta tudo que o vite
        # build detectaria, em ~2-3s.
        run: npx tsc -b --noEmit

      - name: Build (produção via Vite)
        # Compila + bundla + minifica. Mesmo comando do deploy.yml — se
        # passa aqui, passa lá. Não tem `--configuration development` como
        # no Angular CLI; Vite usa NODE_ENV pra alternar modo.
        run: npm run build

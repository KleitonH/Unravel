<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 880" font-family="Segoe UI, Arial, sans-serif">
  <rect x="0" y="0" width="980" height="880" fill="#ffffff"/>
  <text x="490" y="34" text-anchor="middle" font-size="22" font-weight="700" fill="#1a1730">Unravel — Diagrama de Casos de Uso</text>
  <text x="490" y="54" text-anchor="middle" font-size="12" fill="#5d637d">Visão geral (associações detalhadas e relações «include»/«extend» em use-case-diagram.puml)</text>
  <defs>
    <marker id="gen" markerWidth="14" markerHeight="14" refX="11" refY="6" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M1,1 L12,6 L1,11 Z" fill="#ffffff" stroke="#7038f2" stroke-width="1.3"/>
    </marker>
  </defs>

  <!-- ================= ACTOR: Aluno ================= -->
  <g transform="translate(40,300)">
    <circle cx="20" cy="0" r="12" fill="none" stroke="#3757d7" stroke-width="2"/>
    <line x1="20" y1="12" x2="20" y2="40" stroke="#3757d7" stroke-width="2"/>
    <line x1="4" y1="22" x2="36" y2="22" stroke="#3757d7" stroke-width="2"/>
    <line x1="20" y1="40" x2="6" y2="60" stroke="#3757d7" stroke-width="2"/>
    <line x1="20" y1="40" x2="34" y2="60" stroke="#3757d7" stroke-width="2"/>
    <text x="20" y="78" text-anchor="middle" font-size="13" font-weight="700" fill="#3757d7">Aluno</text>
  </g>

  <!-- ================= ACTORS (right) ================= -->
  <g transform="translate(820,120)">
    <circle cx="20" cy="0" r="12" fill="none" stroke="#7038f2" stroke-width="2"/>
    <line x1="20" y1="12" x2="20" y2="40" stroke="#7038f2" stroke-width="2"/>
    <line x1="4" y1="22" x2="36" y2="22" stroke="#7038f2" stroke-width="2"/>
    <line x1="20" y1="40" x2="6" y2="60" stroke="#7038f2" stroke-width="2"/>
    <line x1="20" y1="40" x2="34" y2="60" stroke="#7038f2" stroke-width="2"/>
    <text x="20" y="78" text-anchor="middle" font-size="13" font-weight="700" fill="#7038f2">Moderador</text>
  </g>
  <g transform="translate(820,470)">
    <circle cx="20" cy="0" r="12" fill="none" stroke="#0e7c66" stroke-width="2"/>
    <line x1="20" y1="12" x2="20" y2="40" stroke="#0e7c66" stroke-width="2"/>
    <line x1="4" y1="22" x2="36" y2="22" stroke="#0e7c66" stroke-width="2"/>
    <line x1="20" y1="40" x2="6" y2="60" stroke="#0e7c66" stroke-width="2"/>
    <line x1="20" y1="40" x2="34" y2="60" stroke="#0e7c66" stroke-width="2"/>
    <text x="20" y="78" text-anchor="middle" font-size="13" font-weight="700" fill="#0e7c66">Professor</text>
  </g>
  <g transform="translate(820,640)">
    <circle cx="20" cy="0" r="12" fill="none" stroke="#b45309" stroke-width="2"/>
    <line x1="20" y1="12" x2="20" y2="40" stroke="#b45309" stroke-width="2"/>
    <line x1="4" y1="22" x2="36" y2="22" stroke="#b45309" stroke-width="2"/>
    <line x1="20" y1="40" x2="6" y2="60" stroke="#b45309" stroke-width="2"/>
    <line x1="20" y1="40" x2="34" y2="60" stroke="#b45309" stroke-width="2"/>
    <text x="20" y="78" text-anchor="middle" font-size="13" font-weight="700" fill="#b45309">Sistema</text>
  </g>
  <g transform="translate(820,790)">
    <circle cx="20" cy="0" r="12" fill="none" stroke="#8f95af" stroke-width="2"/>
    <line x1="20" y1="12" x2="20" y2="40" stroke="#8f95af" stroke-width="2"/>
    <line x1="4" y1="22" x2="36" y2="22" stroke="#8f95af" stroke-width="2"/>
    <line x1="20" y1="40" x2="6" y2="60" stroke="#8f95af" stroke-width="2"/>
    <line x1="20" y1="40" x2="34" y2="60" stroke="#8f95af" stroke-width="2"/>
    <text x="20" y="78" text-anchor="middle" font-size="11" font-weight="700" fill="#8f95af">Serviço de IA</text>
  </g>

  <!-- ================= PANEL: Aprendizagem ================= -->
  <rect x="150" y="80" width="250" height="416" rx="10" fill="#eef2ff" stroke="#3757d7" stroke-width="1.5"/>
  <text x="275" y="100" text-anchor="middle" font-size="13" font-weight="700" fill="#3757d7">Aprendizagem (Aluno)</text>
  <g font-size="11.5" fill="#1a1730">
    <text x="166" y="124">UC01 · Autenticar-se</text>
    <text x="166" y="148">UC02 · Nivelamento inicial</text>
    <text x="166" y="172">UC03 · Painel da jornada do dia</text>
    <text x="166" y="196">UC04 · Descobrir trilhas</text>
    <text x="166" y="220">UC05 · Iniciar jornada</text>
    <text x="166" y="244">UC06 · Estudar por capítulos</text>
    <text x="166" y="268" font-weight="700">UC07 · Responder questões</text>
    <text x="166" y="292">UC08 · Quiz adaptativo</text>
    <text x="166" y="316">UC09 · Boss Fight</text>
    <text x="166" y="340">UC10 · Quiz de reforço</text>
    <text x="166" y="364">UC11 · Mapa de progresso</text>
    <text x="166" y="388">UC12 · Radar de fraquezas</text>
    <text x="166" y="412">UC13 · Perfil e progresso</text>
  </g>
  <text x="166" y="452" font-size="10" fill="#5d637d">UC06/08/09/10 «include» UC07</text>
  <text x="166" y="470" font-size="10" fill="#5d637d">(responder questões)</text>

  <!-- ================= PANEL: Gamificação e Social ================= -->
  <rect x="150" y="516" width="250" height="190" rx="10" fill="#fff7ed" stroke="#b45309" stroke-width="1.5" stroke-dasharray="5 4"/>
  <text x="275" y="536" text-anchor="middle" font-size="13" font-weight="700" fill="#b45309">Gamificação e Social — planejado</text>
  <g font-size="11.5" fill="#1a1730">
    <text x="166" y="560">UC14 · Login diário / ofensiva</text>
    <text x="166" y="584">UC15 · Loja de cosméticos (NAVI)</text>
    <text x="166" y="608">UC16 · Badges, títulos e ranking</text>
    <text x="166" y="632">UC17 · Parceria colaborativa</text>
    <text x="166" y="656">UC18 · Caixinha de Gatos (grupo)</text>
    <text x="166" y="680">UC19 · Arena (PvP)</text>
  </g>

  <!-- ================= PANEL: Curadoria ================= -->
  <rect x="470" y="80" width="270" height="320" rx="10" fill="#f3eefe" stroke="#7038f2" stroke-width="1.5"/>
  <text x="605" y="100" text-anchor="middle" font-size="13" font-weight="700" fill="#7038f2">Curadoria de Conteúdo (Moderador)</text>
  <g font-size="11.5" fill="#1a1730">
    <text x="486" y="124">UC20 · Criar/editar trilha</text>
    <text x="486" y="148">UC21 · Criar/editar conteúdo</text>
    <text x="486" y="172">UC22 · Gerar questões por IA</text>
    <text x="486" y="196">UC23 · Escrever questão autoral</text>
    <text x="486" y="220">UC24 · Editar/remover questões</text>
    <text x="486" y="244">UC25 · Curar gabarito (gold)</text>
    <text x="486" y="268">UC26 · Acompanhar fila de geração</text>
    <text x="486" y="292">UC27 · Gerenciar tokens (Novelo de Lã)</text>
    <text x="486" y="316">UC28 · Publicar trilha</text>
  </g>
  <text x="486" y="356" font-size="10" fill="#5d637d">UC22 «include» UC32 · «usa» Serviço de IA</text>
  <text x="486" y="374" font-size="10" fill="#5d637d">UC28 «extend» UC22/UC23</text>

  <!-- ================= PANEL: Sala de Aula ================= -->
  <rect x="470" y="420" width="270" height="120" rx="10" fill="#ecfdf5" stroke="#0e7c66" stroke-width="1.5" stroke-dasharray="5 4"/>
  <text x="605" y="440" text-anchor="middle" font-size="13" font-weight="700" fill="#0e7c66">Sala de Aula — planejado</text>
  <g font-size="11.5" fill="#1a1730">
    <text x="486" y="466">UC29 · Modo Aula (quiz ao vivo)</text>
    <text x="486" y="490">UC30 · Relatório pedagógico</text>
  </g>
  <text x="486" y="520" font-size="10" fill="#5d637d">Aluno participa do UC29</text>

  <!-- ================= PANEL: Automação ================= -->
  <rect x="470" y="560" width="270" height="150" rx="10" fill="#fef2f2" stroke="#b45309" stroke-width="1.5"/>
  <text x="605" y="580" text-anchor="middle" font-size="13" font-weight="700" fill="#b45309">Automação (Sistema)</text>
  <g font-size="11.5" fill="#1a1730">
    <text x="486" y="604">UC31 · Replanejar jornadas</text>
    <text x="486" y="628">UC32 · Processar geração de questões</text>
    <text x="486" y="652">UC33 · Desativar questões ruins</text>
    <text x="486" y="676">UC34 · Recarregar recursos (refill)</text>
  </g>

  <!-- ===== Generalização: Professor é um Moderador ===== -->
  <line x1="840" y1="458" x2="840" y2="210" stroke="#7038f2" stroke-width="1.5" marker-end="url(#gen)"/>
  <text x="848" y="340" font-size="10.5" fill="#7038f2" font-style="italic">é um</text>

  <!-- ================= ASSOCIAÇÕES ================= -->
  <!-- Aluno -> Aprendizagem / Gamificação -->
  <line x1="78" y1="320" x2="150" y2="280" stroke="#3757d7" stroke-width="1.3"/>
  <line x1="78" y1="340" x2="150" y2="600" stroke="#3757d7" stroke-width="1.3"/>
  <!-- Aluno -> Sala de Aula (participante) -->
  <line x1="80" y1="345" x2="470" y2="470" stroke="#3757d7" stroke-width="1" stroke-dasharray="3 3"/>
  <!-- Moderador -> Curadoria -->
  <line x1="820" y1="150" x2="740" y2="200" stroke="#7038f2" stroke-width="1.3"/>
  <!-- Professor -> Sala de Aula -->
  <line x1="820" y1="500" x2="740" y2="475" stroke="#0e7c66" stroke-width="1.3"/>
  <!-- Sistema -> Automação -->
  <line x1="820" y1="660" x2="740" y2="630" stroke="#b45309" stroke-width="1.3"/>
  <!-- IA -> Automação (UC32) e Curadoria (UC22) -->
  <line x1="820" y1="810" x2="740" y2="660" stroke="#8f95af" stroke-width="1" stroke-dasharray="3 3"/>
  <line x1="818" y1="805" x2="740" y2="360" stroke="#8f95af" stroke-width="1" stroke-dasharray="3 3"/>

  <!-- Legenda -->
  <text x="40" y="832" font-size="10.5" fill="#5d637d">Legenda: linha cheia = associação ator–caso de uso · linha tracejada = participação/uso secundário · painel tracejado = subsistema planejado</text>
  <text x="40" y="848" font-size="10.5" fill="#5d637d">Seta com triângulo vazado (Professor ▷ Moderador) = generalização: o Professor é um Moderador e herda seus casos de uso.</text>
</svg>

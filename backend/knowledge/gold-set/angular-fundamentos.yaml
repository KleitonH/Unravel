# Gold set — Angular Fundamentos (PR 33)
#
# 50 perguntas curadas manualmente que representam "o que um bom
# generator LLM deveria produzir" a partir dos MDs de
# backend/knowledge/angular-fundamentos/.
#
# Esse arquivo é a REGUA do `dotnet run -- forge:eval`. Não é input
# do quiz nem é importado pro DB — só serve pra comparar a saída real
# do generator contra o que humano consideraria boa pergunta.
#
# ─── Schema por item ────────────────────────────────────────────────
#   topicSlug:       slug do Content (igual ao frontmatter do .md)
#   chunkHeading:    (opcional) H2/H3 dentro do MD pra ancorar a fonte
#   sourceClaim:     a afirmação testável que o item exercita
#   prompt:          a pergunta — natural, sem markdown
#   correctAnswer:   resposta correta (texto)
#   distractors:     3 distratores plausíveis (do mesmo domínio,
#                    mas incorretos pelo MD)
#   explanation:     1 frase justificando porque a correta é correta
#   difficultyHint:  0.05–0.95, opcional (default 0.50)
#
# ─── Como preencher os TODOs ────────────────────────────────────────
# Cada tópico tem 1 exemplo COMPLETO (seguir o padrão) + 4 placeholders
# marcados `# TODO`. Substitua cada bloco TODO por um item completo.
# Boas práticas:
#   - prompt NÃO deve vazar a resposta literal (testa raciocínio)
#   - distratores devem soar plausíveis pra quem não estudou
#   - resposta deve estar parafraseada ou literal no MD do tópico
#
# ─── Validar ────────────────────────────────────────────────────────
#   cd backend
#   dotnet run --project src/Unravel.API -- forge:eval \
#     --gold knowledge/gold-set/angular-fundamentos.yaml \
#     --out out/
# Report aparece em out/forge-eval-<timestamp>.html


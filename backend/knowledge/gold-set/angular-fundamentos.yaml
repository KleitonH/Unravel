  # ─── 6) angular-services ──────────────────────────────────────────
  - topicSlug: angular-services
    chunkHeading: "O que é um service"
    sourceClaim: "Services centralizam lógica que não pertence a um componente específico, como acesso a API ou estado compartilhado."
    prompt: "Qual o motivo principal de extrair lógica de um componente para um service?"
    correctAnswer: "Reutilizar a lógica entre componentes e isolar responsabilidades não-visuais"
    distractors:
      - "Aumentar o desempenho do change detection do componente"
      - "Obrigar o Angular a recompilar o módulo a cada mudança"
      - "Garantir que o componente seja renderizado uma única vez no DOM"
    explanation: "Services tiram do componente tudo que não é UI — chamadas HTTP, cálculos, estado — e permitem que vários componentes compartilhem essa lógica."
    difficultyHint: 0.35


  # ─── 7) angular-dependency-injection ──────────────────────────────
  - topicSlug: angular-dependency-injection
    chunkHeading: "Como o Angular resolve dependências"
    sourceClaim: "O Angular resolve dependências de um componente percorrendo a hierarquia de injetores até encontrar o provider compatível."
    prompt: "O que o Angular faz quando um componente declara uma dependência via inject() ou construtor?"
    correctAnswer: "Percorre a hierarquia de injetores em busca do provider e injeta a instância no componente"
    distractors:
      - "Instancia uma nova cópia da classe a cada renderização do componente"
      - "Marca a propriedade como undefined até o componente chamar set manualmente"
      - "Cria um proxy lazy que só resolve a dependência no primeiro acesso"
    explanation: "DI é resolvido no startup do componente: o injector procura na própria hierarquia (componente → módulo → root) até achar provider e injeta a instância."
    difficultyHint: 0.55

